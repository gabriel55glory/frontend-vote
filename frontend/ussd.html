<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USSD *347# — Vote Nigeria</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .ussd-wrap { min-height: calc(100vh - 62px); display: grid; place-items: center; padding: 40px 20px; background: linear-gradient(160deg, #f4f6f5, #d9e6df); }
    .phone {
      width: 320px; background: #1f2a24; border-radius: 36px; padding: 22px 18px;
      box-shadow: 0 25px 60px rgba(0,0,0,.3); position: relative;
    }
    .phone::before { content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 60px; height: 6px; background: #000; border-radius: 4px; }
    .screen {
      background: #cdd6cf; border-radius: 14px; padding: 18px; min-height: 320px;
      display: flex; flex-direction: column; font-family: 'Courier New', monospace; color: #000;
    }
    .screen-head { text-align: center; font-size: .72rem; color: #4a5650; border-bottom: 1px dashed #6b7872; padding-bottom: 8px; margin-bottom: 10px; }
    .screen-body { flex: 1; white-space: pre-wrap; font-size: .92rem; line-height: 1.5; overflow-y: auto; }
    .screen-input { background: #fff; border-radius: 8px; padding: 10px; margin-top: 12px; display: flex; gap: 8px; }
    .screen-input input { flex: 1; border: 1px solid #999; border-radius: 6px; padding: 8px; font-family: 'Courier New', monospace; }
    .screen-input button { background: #2d6b46; color: #fff; border-radius: 6px; padding: 0 14px; font-weight: 700; }
    .keypad { margin-top: 14px; display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .key { background: #2c3a32; color: #fff; border-radius: 50%; aspect-ratio: 1; display: grid; place-items: center; font-size: 1.3rem; font-weight: 600; cursor: pointer; }
    .key:hover { background: #3c4a42; }
    .key.send { background: var(--green); }
    .key.send:hover { background: var(--green-d); }
    .hint { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 16px; max-width: 320px; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <div class="ussd-wrap">
    <div>
      <div class="phone">
        <div class="screen">
          <div class="screen-head">USSD • *347# • Vote Nigeria</div>
          <div class="screen-body" id="screenBody">Welcome to Vote Nigeria
1. Register / Login
2. Vote in an election
3. Check election results
4. Exit</div>
          <div class="screen-input">
            <input id="ussdInput" placeholder="Enter option" />
            <button id="sendBtn">Send</button>
          </div>
        </div>
        <div class="keypad">
          <div class="key">1</div><div class="key">2</div><div class="key">3</div>
          <div class="key">4</div><div class="key">5</div><div class="key">6</div>
          <div class="key">7</div><div class="key">8</div><div class="key">9</div>
          <div class="key">*</div><div class="key">0</div><div class="key">#</div>
        </div>
      </div>
      <p class="hint">This simulates the USSD code <b>*347#</b>. Type your option and press Send.</p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    VN.renderNavbar('ussd.html');
    let ussdText = '';
    const screenBody = document.getElementById('screenBody');
    const input = document.getElementById('ussdInput');

    function appendScreen(s) {
      screenBody.textContent = s;
    }

    document.getElementById('sendBtn').onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

    async function send() {
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      ussdText = ussdText ? `${ussdText}*${val}` : val;
      const r = await VN.api('/api/ussd', {
        method: 'POST',
        body: JSON.stringify({ sessionId: 'demo', phoneNumber: VN.sessionPhone() || '', text: ussdText })
      });
      if (r.error) { appendScreen('Service error.'); return; }
      appendScreen(r.text);
      if (r.terminate) ussdText = '';
    }

    document.querySelectorAll('.key').forEach(k => {
      k.onclick = () => {
        if (k.textContent === 'Send' || k.classList.contains('send')) return;
        input.value += k.textContent;
      };
    });
  </script>
</body>
</html>
